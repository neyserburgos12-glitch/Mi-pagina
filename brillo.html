<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Brillo Mágico</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Arial', sans-serif;
      background: linear-gradient(135deg, #3f51b5, #5e35b1, #ec407a);
      overflow: hidden;
      color: white;
      position: relative;
    }
    .glow {
      position: absolute;
      width: 240px;
      height: 240px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.16);
      filter: blur(40px);
      animation: pulse 3.8s ease-in-out infinite;
    }
    .glow:nth-child(1) { top: 10%; left: 15%; }
    .glow:nth-child(2) { top: 68%; left: 10%; animation-delay: 1s; }
    .glow:nth-child(3) { top: 35%; left: 75%; background: rgba(255,255,255,0.2); animation-delay: 2s; }
    .panel {
      position: relative;
      z-index: 1;
      max-width: 520px;
      width: 90%;
      background: rgba(8, 16, 45, 0.88);
      border-radius: 30px;
      padding: 32px 30px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
      text-align: center;
      animation: fadeIn 1.6s ease;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 2.3rem;
      letter-spacing: 0.05em;
    }
    p {
      margin: 0 0 26px;
      line-height: 1.7;
      font-size: 1rem;
      opacity: 0.95;
    }
    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      background: #00e5ff;
      color: #081229;
      text-decoration: none;
      font-weight: 700;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    a:hover {
      transform: translateY(-2px);
      background: #76ffff;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.16; }
      50% { transform: scale(1.2); opacity: 0.3; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow"></div>
  <div class="glow"></div>
  <div class="panel">
    <h1>Brillo Mágico</h1>
    <p>El brillo en tus ojos son los mas hermosos que he visto.</p>
    <a href="index.html">Volver</a>
  </div>
</body>
</html>
