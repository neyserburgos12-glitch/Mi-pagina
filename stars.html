<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cielo de Estrellas</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: radial-gradient(circle at top, #0b1e4a, #07102a 60%, #02030a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .sky {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 20%),
                  radial-gradient(circle at 80% 15%, rgba(178,226,255,0.12), transparent 18%),
                  radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08), transparent 20%);
      z-index: 0;
      animation: glowSky 12s ease-in-out infinite alternate;
    }

    .star-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,255,255,0.9);
      opacity: 0.85;
      animation: twinkle 4s infinite ease-in-out alternate;
    }

    .shooting-star {
      position: absolute;
      top: 20%;
      left: -10%;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.9), rgba(255,255,255,0));
      filter: blur(1px);
      transform: rotate(-25deg);
      animation: shooting 5.5s ease-in-out infinite;
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 900px;
      width: 92%;
      padding: 30px;
      border-radius: 24px;
      background: rgba(4, 14, 36, 0.92);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      animation: fadeIn 1.8s ease;
    }

    .media {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 22px;
      align-items: center;
      margin-top: 24px;
    }

    .tiktok-container {
      display: flex;
      justify-content: center;
      padding: 10px;
    }

    audio {
      width: 100%;
      padding: 14px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes twinkle {
      from { opacity: 0.4; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.2); }
    }

    @keyframes glowSky {
      from { background-position: 20% 20%, 80% 15%, 50% 80%; }
      to { background-position: 22% 18%, 78% 10%, 48% 85%; }
    }

    @keyframes shooting {
      0% { transform: translateX(0) rotate(-25deg); opacity: 0; }
      10% { opacity: 1; }
      60% { transform: translateX(180vw) rotate(-25deg); opacity: 1; }
      100% { transform: translateX(180vw) rotate(-25deg); opacity: 0; }
    }
  </style>
</head>
<body>

<div class="sky"></div>
<div class="star-field"></div>
<div class="shooting-star"></div>

<div class="content">
  <h1>Cielo Iluminado de Estrellas</h1>
  <p>Disfruta este momento con un video especial ❤️</p>

  <div class="media">

    <!-- VIDEO TIKTOK -->
    <div class="tiktok-container">
      <blockquote class="tiktok-embed"
        cite="https://www.tiktok.com/@elkin_crazzy/video/7493682110654385414"
        data-video-id="7493682110654385414"
        style="max-width: 325px; min-width: 325px;">
        <section>
          <a target="_blank" href="https://www.tiktok.com/@elkin_crazzy">@elkin_crazzy</a>
        </section>
      </blockquote>
    </div>

    <!-- AUDIO -->
    <div>
      <audio controls autoplay loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
      </audio>
    </div>

  </div>

</div>

<script async src="https://www.tiktok.com/embed.js"></script>

</body>
</html>
