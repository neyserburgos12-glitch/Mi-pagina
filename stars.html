<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cielo de Estrellas</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: 'Arial', sans-serif;
      background: radial-gradient(circle at top, #0b1e4a, #07102a 60%, #02030a);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .sky {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,0.12), transparent 20%),
                  radial-gradient(circle at 80% 15%, rgba(178,226,255,0.12), transparent 18%),
                  radial-gradient(circle at 50% 80%, rgba(255,255,255,0.08), transparent 20%);
      z-index: 0;
      animation: glowSky 12s ease-in-out infinite alternate;
    }

    .star-field {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .star {
      position: absolute;
      width: 4px;
      height: 4px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255,255,255,0.9);
      opacity: 0.85;
      animation: twinkle 4s infinite ease-in-out alternate;
    }

    .star:nth-child(odd) { animation-duration: 3.2s; }
    .star:nth-child(even) { animation-duration: 5s; }

    .shooting-star {
      position: absolute;
      top: 20%;
      left: -10%;
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.9), rgba(255,255,255,0));
      filter: blur(1px);
      transform: rotate(-25deg);
      animation: shooting 5.5s ease-in-out infinite;
      z-index: 2;
    }

    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      max-width: 900px;
      width: 92%;
      padding: 30px;
      border-radius: 24px;
      background: rgba(4, 14, 36, 0.92);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
      backdrop-filter: blur(10px);
      animation: fadeIn 1.8s ease;
    }

    .media {
      display: grid;
      grid-template-columns: 1.7fr 1fr;
      gap: 22px;
      align-items: center;
      margin-top: 24px;
    }

    .video-card,
    .audio-card {
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 45px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(10px);
    }

    video {
      width: 100%;
      display: block;
      border-bottom: 1px solid rgba(255,255,255,0.15);
    }

    audio {
      width: 100%;
      outline: none;
      background: rgba(255,255,255,0.05);
      padding: 14px 16px;
    }

    .video-card p,
    .audio-card p {
      margin: 0;
      padding: 16px;
      color: #e8efff;
      font-size: 0.98rem;
      line-height: 1.5;
      text-align: left;
    }

    .content h1 {
      margin: 0 0 12px;
      font-size: 2.4rem;
      letter-spacing: 0.06em;
    }

    .content p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.6;
      color: #d7e3ff;
    }

    .footer-link {
      margin-top: 28px;
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      background: #7c8cff;
      color: white;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 12px 24px rgba(124,140,255,0.25);
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    .footer-link:hover {
      transform: translateY(-2px);
      background: #5061ff;
      box-shadow: 0 16px 30px rgba(80,97,255,0.3);
    }

    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      background: #7c8cff;
      color: white;
      text-decoration: none;
      font-weight: 600;
      box-shadow: 0 12px 24px rgba(124,140,255,0.25);
      transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
    }

    a:hover {
      transform: translateY(-2px);
      background: #5061ff;
      box-shadow: 0 16px 30px rgba(80,97,255,0.3);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes twinkle {
      from { opacity: 0.4; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.2); }
    }

    @keyframes glowSky {
      from { background-position: 20% 20%, 80% 15%, 50% 80%; }
      to { background-position: 22% 18%, 78% 10%, 48% 85%; }
    }

    @keyframes shooting {
      0% { transform: translateX(0) rotate(-25deg); opacity: 0; }
      10% { opacity: 1; }
      60% { transform: translateX(180vw) rotate(-25deg); opacity: 1; }
      100% { transform: translateX(180vw) rotate(-25deg); opacity: 0; }
    }
  </style>
</head>
<body>

    <span class="star" style="top: 88%; left: 70%; width: 3px; height: 3px;"></span>
  </div>
  <div class="shooting-star"></div>
