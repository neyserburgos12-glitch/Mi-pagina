<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cielo de Estrellas</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial;
      background: radial-gradient(circle at top, #1b2a4b 0%, #02030a 60%, #000005 100%);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-repeat: repeat;
      opacity: 0.7;
      transform: translateZ(0);
    }

    body::before {
      background-image: radial-gradient(circle, rgba(255,255,255,0.95) 1px, transparent 1px);
      background-size: 18px 18px;
      animation: drift 80s linear infinite;
    }

    body::after {
      background-image: radial-gradient(circle, rgba(255,255,255,0.55) 1px, transparent 1px);
      background-size: 8px 8px;
      animation: drift 120s linear infinite reverse;
      opacity: 0.4;
    }

    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      width: 90%;
      max-width: 900px;
    }

    .media {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      justify-content: center;
      margin-top: 20px;
    }

    .tiktok-container {
      max-width: 325px;
      width: 100%;
    }

    .video-panel {
      flex: 1 1 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .left-text {
      max-width: 280px;
      text-align: center;
      font-size: 1.05rem;
      line-height: 1.4;
    }

    .animated-world {
      display: inline-block;
      font-size: 3rem;
      margin-top: 12px;
      animation: spin 6s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes drift {
      from { transform: translate(0, 0); }
      to { transform: translate(-1200px, 1200px); }
    }

    audio {
      width: 300px;
    }
  </style>
</head>

<body>

<div class="content">
  <h1>Cielo Iluminado ✨</h1>

  <div class="media">

    <!-- TIKTOK -->
    <div class="tiktok-container">
      <blockquote class="tiktok-embed"
        cite="https://www.tiktok.com/@elkin_crazzy/video/7493682110654385414"
        data-video-id="7493682110654385414"
        style="max-width:325px; min-width:325px;">
        <section></section>
      </blockquote>
    </div>

    <!-- VIDEO -->
    <div class="video-panel">
      <div class="left-text">
        <p style="margin:0;">Me haces la persona más feliz del mundo.</p>
        <div class="animated-world">🌍</div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <video controls loop width="325">
          <source src="Mi video.mp4" type="video/mp4">
          Tu navegador no soporta video HTML5.
        </video>
        <p style="text-align:center; margin: 0;">ESTE VIDEO ES PARA TI</p>
      </div>
    </div>

  </div>
</div>

</body>
</html>
