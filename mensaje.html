<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mensaje para ti</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      font-family: 'Arial', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top, #ffe2f1, #ffccd9 50%, #ff9ab2);
      overflow: hidden;
      position: relative;
    }
    .heart {
      position: absolute;
      width: 22px;
      height: 22px;
      background: #ff5c94;
      transform: rotate(45deg);
      border-radius: 50% 50% 0 0;
      animation: floatHeart 4s ease-in-out infinite;
    }
    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 22px;
      height: 22px;
      background: #ff5c94;
      border-radius: 50%;
      top: -11px;
      left: 0;
    }
    .heart::after {
      left: 11px;
    }
    .message {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 30px 28px;
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 18px 50px rgba(255, 110, 160, 0.2);
      max-width: 520px;
      width: 90%;
      animation: fadeIn 1.6s ease;
    }
    h1 {
      margin: 0 0 12px;
      color: #d43f6f;
      letter-spacing: 0.06em;
    }
    p {
      margin: 0 0 26px;
      color: #6b3a53;
      font-size: 1.05rem;
      line-height: 1.6;
    }
    a {
      display: inline-block;
      padding: 14px 26px;
      border-radius: 999px;
      background: #ff5c94;
      color: white;
      text-decoration: none;
      font-weight: 600;
      transition: transform 0.25s ease, background 0.25s ease;
    }
    a:hover {
      transform: translateY(-2px);
      background: #ff3270;
    }
    @keyframes floatHeart {
      0% { transform: translateY(0) rotate(45deg); opacity: 0.75; }
      50% { transform: translateY(-24px) rotate(45deg); opacity: 1; }
      100% { transform: translateY(0) rotate(45deg); opacity: 0.75; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="heart" style="top: 15%; left: 20%; animation-delay: 0s;"></div>
  <div class="heart" style="top: 30%; left: 70%; width: 18px; height: 18px; animation-delay: 0.5s;"></div>
  <div class="heart" style="top: 55%; left: 30%; width: 24px; height: 24px; animation-delay: 1s;"></div>
  <div class="heart" style="top: 68%; left: 80%; width: 20px; height: 20px; animation-delay: 1.4s;"></div>

  <div class="message">
    <h1>Mensaje para ti</h1>
    <p>Cada palabra que comparto contigo está llena de cariño. Gracias por ser tan especial y por hacer brillar cada momento.</p>
    <a href="index.html">Volver</a>
  </div>
</body>
</html>
