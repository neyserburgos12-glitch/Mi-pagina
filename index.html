<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Para Ti ❤️</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: radial-gradient(circle at top left, rgba(255,255,255,0.9), transparent 30%),
                  radial-gradient(circle at bottom right, rgba(255,255,255,0.7), transparent 25%),
                  linear-gradient(135deg, #ff9a9e, #fad0c4 40%, #f6d365 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .stars {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255,255,255,0.9);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255,255,255,0.8);
      animation: twinkle 3s infinite ease-in-out alternate;
    }

    .star:nth-child(2) { width: 8px; height: 8px; top: 15%; left: 20%; animation-duration: 4s; }
    .star:nth-child(3) { width: 5px; height: 5px; top: 30%; left: 75%; animation-duration: 3.2s; }
    .star:nth-child(4) { width: 7px; height: 7px; top: 60%; left: 55%; animation-duration: 4.5s; }
    .star:nth-child(5) { width: 6px; height: 6px; top: 70%; left: 25%; animation-duration: 3.8s; }
    .star:nth-child(6) { width: 5px; height: 5px; top: 45%; left: 85%; animation-duration: 3.6s; }

    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 35px 30px;
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.15);
      text-align: center;
      max-width: 420px;
      width: 90%;
      position: relative;
      z-index: 1;
      animation: fadeIn 1.8s ease, floatCard 8s ease-in-out infinite alternate;
    }

    h1 {
      color: #ff3d6b;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    p {
      font-size: 18px;
      color: #6e5a73;
      line-height: 1.5;
      margin: 0 0 24px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 999px;
      background: #ff6f91;
      color: white;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      box-shadow: 0 10px 20px rgba(255,111,145,0.25);
    }

    button:hover {
      transform: translateY(-2px);
      background: #ff2e63;
      box-shadow: 0 14px 28px rgba(255,46,99,0.25);
    }

    button.secondary {
      background: #ffbf5d;
      box-shadow: 0 10px 20px rgba(255,191,93,0.24);
    }

    button.secondary:hover {
      background: #ff9f3d;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes twinkle {
      from { opacity: 0.4; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1.15); }
    }

    @keyframes floatCard {
      from { transform: translateY(0); }
      to { transform: translateY(-8px); }
    }
  </style>
</head>
<body>

  <div class="stars">
    <span class="star" style="top: 8%; left: 12%;"></span>
    <span class="star" style="top: 18%; left: 76%;"></span>
    <span class="star" style="top: 34%; left: 46%;"></span>
    <span class="star" style="top: 62%; left: 18%;"></span>
    <span class="star" style="top: 54%; left: 82%;"></span>
    <span class="star" style="top: 85%; left: 40%;"></span>
  </div>

  <div class="card">
    <h1>Para Ti ❤️</h1>
    <p id="mensaje">Eres la persona más especial en mi vida.</p>
    <div class="buttons">
      <button onclick="irADestino('mensaje.html')">Haz clic 💖</button>
      <button class="secondary" onclick="irADestino('sonrisa.html')">clik aqui: 😊</button>
      <button class="secondary" onclick="irADestino('brillo.html')">clik aqui ✨</button>
      <button class="secondary" onclick="irADestino('stars.html')">Ir al cielo 🌌</button>
    </div>
  </div>

  <script>
    function irADestino(url) {
      window.location.href = url;
    }
  </script>

</body>
</html>
